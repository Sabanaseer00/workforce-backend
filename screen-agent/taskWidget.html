<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Tasks</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: #0a0b0f;
  color: #e8eaf6;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #0a0b0f; }
::-webkit-scrollbar-thumb { background: #1c1f2e; border-radius: 4px; }

/* Header */
.header {
  background: #0e1018;
  border-bottom: 1px solid #1c1f2e;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-icon {
  width: 26px; height: 26px;
  background: rgba(91,115,255,0.15);
  border: 1px solid rgba(91,115,255,0.3);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.header-title {
  font-size: 13px;
  font-weight: 700;
  color: #e8eaf6;
  letter-spacing: -0.01em;
}
.header-sub {
  font-size: 10px;
  color: #4d5570;
}

/* Live indicator */
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #34d399;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Refresh btn */
.refresh-btn {
  width: 26px; height: 26px;
  border-radius: 7px;
  border: 1px solid #1c1f2e;
  background: transparent;
  color: #4d5570;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
}
.refresh-btn:hover { background: #13151f; color: #9196b0; }
.refresh-btn.spinning { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 0;
  background: #0a0b0f;
  border-bottom: 1px solid #1c1f2e;
}
.stat-item {
  flex: 1;
  padding: 8px 10px;
  text-align: center;
  border-right: 1px solid #1c1f2e;
}
.stat-item:last-child { border-right: none; }
.stat-val {
  font-size: 18px;
  font-weight: 800;
  font-family: 'Consolas', monospace;
  line-height: 1;
  margin-bottom: 2px;
}
.stat-lbl {
  font-size: 9px;
  color: #4d5570;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}

/* Task list */
.task-list {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Task card */
.task-card {
  background: #0e1018;
  border: 1px solid #1c1f2e;
  border-radius: 10px;
  padding: 12px 13px;
  transition: border-color 0.2s;
  animation: fadeUp 0.2s ease both;
}
.task-card:hover { border-color: #252838; }
@keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

.task-card.active  { border-color: rgba(91,115,255,0.4); background: rgba(91,115,255,0.04); }
.task-card.done    { border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.03); opacity: 0.7; }
.task-card.blocked { border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.03); }

.task-title {
  font-size: 12px;
  font-weight: 600;
  color: #e8eaf6;
  margin-bottom: 4px;
  line-height: 1.4;
}
.task-desc {
  font-size: 11px;
  color: #6b7280;
  margin-bottom: 8px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.task-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

/* Status badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-pending    { background: rgba(245,166,35,0.12);  color: #f5a623; }
.badge-progress   { background: rgba(91,115,255,0.12);  color: #818cf8; }
.badge-review     { background: rgba(167,139,250,0.12); color: #a78bfa; }
.badge-completed  { background: rgba(52,211,153,0.12);  color: #34d399; }
.badge-blocked    { background: rgba(248,113,113,0.12); color: #f87171; }

.badge-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.badge-dot.pulse { animation: pulse 1.5s infinite; }

/* Priority badge */
.pri-low    { color: #34d399; font-size: 10px; }
.pri-medium { color: #f5a623; font-size: 10px; }
.pri-high   { color: #fb923c; font-size: 10px; }
.pri-urgent { color: #f87171; font-size: 10px; }

/* Due date */
.due-date {
  font-size: 10px;
  color: #4d5570;
  display: flex;
  align-items: center;
  gap: 3px;
}
.due-date.overdue { color: #f87171; font-weight: 600; }

/* Action buttons */
.task-actions {
  display: flex;
  gap: 6px;
}

.btn {
  flex: 1;
  padding: 6px 10px;
  border-radius: 7px;
  border: none;
  font-family: 'Segoe UI', sans-serif;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.2s;
}

.btn-complete {
  background: rgba(52,211,153,0.1);
  border: 1px solid rgba(52,211,153,0.25);
  color: #34d399;
}
.btn-complete:hover {
  background: rgba(52,211,153,0.2);
  border-color: rgba(52,211,153,0.4);
}

.btn-review {
  background: rgba(167,139,250,0.1);
  border: 1px solid rgba(167,139,250,0.25);
  color: #a78bfa;
}
.btn-review:hover {
  background: rgba(167,139,250,0.2);
  border-color: rgba(167,139,250,0.4);
}

.btn-progress {
  background: rgba(91,115,255,0.1);
  border: 1px solid rgba(91,115,255,0.25);
  color: #818cf8;
}
.btn-progress:hover {
  background: rgba(91,115,255,0.2);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Empty state */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: #2a2d3e;
}
.empty-icon { font-size: 32px; margin-bottom: 10px; }
.empty-title { font-size: 13px; font-weight: 600; color: #4d5570; margin-bottom: 4px; }
.empty-sub { font-size: 11px; color: #2a2d3e; }

/* Loading */
.loading {
  text-align: center;
  padding: 40px 20px;
  color: #4d5570;
  font-size: 12px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid #1c1f2e;
  border-top-color: #818cf8;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 10px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #13151f;
  border: 1px solid #252838;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 600;
  color: #e8eaf6;
  opacity: 0;
  transition: transform 0.3s ease, opacity 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
  z-index: 100;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.toast.success { border-left: 3px solid #34d399; }
.toast.error   { border-left: 3px solid #f87171; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-icon">📋</div>
    <div>
      <div class="header-title">My Tasks</div>
      <div class="header-sub" id="emp-name">Loading...</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="live-dot"></div>
    <button class="refresh-btn" id="refresh-btn" onclick="loadTasks()" title="Refresh">↻</button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-val" id="stat-total" style="color:#818cf8">0</div>
    <div class="stat-lbl">Total</div>
  </div>
  <div class="stat-item">
    <div class="stat-val" id="stat-active" style="color:#818cf8">0</div>
    <div class="stat-lbl">Active</div>
  </div>
  <div class="stat-item">
    <div class="stat-val" id="stat-done" style="color:#34d399">0</div>
    <div class="stat-lbl">Done</div>
  </div>
  <div class="stat-item">
    <div class="stat-val" id="stat-pending" style="color:#f5a623">0</div>
    <div class="stat-lbl">Pending</div>
  </div>
</div>

<!-- Task list -->
<div id="task-container">
  <div class="loading">
    <div class="spinner"></div>
    Loading tasks...
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const { ipcRenderer } = require('electron');

let tasks = [];
let updating = null;

// ── Toast ──────────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `toast ${type} show`;
  setTimeout(() => { t.classList.remove('show'); }, 2500);
}

// ── Format date ────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.toLocaleDateString('en-PK', { day:'2-digit', month:'short' });
}

function isOverdue(due, status) {
  if (!due || status === 'completed') return false;
  return new Date(due) < new Date();
}

// ── Priority label ─────────────────────────────────────────────────
function priLabel(p) {
  const map = { low:'🟢 Low', medium:'🟡 Med', high:'🟠 High', urgent:'🔴 Urgent' };
  return map[p] || p;
}

// ── Status badge HTML ──────────────────────────────────────────────
function statusBadge(status) {
  const map = {
    pending:     `<span class="badge badge-pending"><span class="badge-dot"></span>Pending</span>`,
    in_progress: `<span class="badge badge-progress"><span class="badge-dot pulse"></span>In Progress</span>`,
    in_review:   `<span class="badge badge-review"><span class="badge-dot"></span>In Review</span>`,
    completed:   `<span class="badge badge-completed">✓ Completed</span>`,
    blocked:     `<span class="badge badge-blocked">✕ Blocked</span>`,
  };
  return map[status] || `<span class="badge badge-pending">${status}</span>`;
}

// ── Action buttons based on current status ─────────────────────────
function actionButtons(task) {
  const id = task._id || task.id;
  const s  = task.status;

  if (s === 'completed') {
    return `<div class="task-actions">
      <div style="text-align:center;font-size:11px;color:#34d399;padding:6px;width:100%;">
        ✓ Task completed!
      </div>
    </div>`;
  }

  if (s === 'blocked') {
    return `<div class="task-actions">
      <button class="btn btn-progress" onclick="updateStatus('${id}','in_progress')">
        ▶ Resume
      </button>
    </div>`;
  }

  if (s === 'in_review') {
    return `<div class="task-actions">
      <div style="text-align:center;font-size:11px;color:#a78bfa;padding:6px;width:100%;">
        ⏳ Admin review mein hai...
      </div>
    </div>`;
  }

  if (s === 'in_progress') {
    return `<div class="task-actions">
      <button class="btn btn-review" onclick="updateStatus('${id}','in_review')">
        👁 Review ke liye bhejo
      </button>
      <button class="btn btn-complete" onclick="updateStatus('${id}','completed')">
        ✓ Complete
      </button>
    </div>`;
  }

  // pending
  return `<div class="task-actions">
    <button class="btn btn-progress" onclick="updateStatus('${id}','in_progress')">
      ▶ Shuru karo
    </button>
  </div>`;
}

// ── Render tasks ───────────────────────────────────────────────────
function renderTasks() {
  const container = document.getElementById('task-container');

  // Stats update
  document.getElementById('stat-total').textContent   = tasks.length;
  document.getElementById('stat-active').textContent  = tasks.filter(t=>t.status==='in_progress').length;
  document.getElementById('stat-done').textContent    = tasks.filter(t=>t.status==='completed').length;
  document.getElementById('stat-pending').textContent = tasks.filter(t=>t.status==='pending').length;

  if (!tasks.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div class="empty-title">Koi task nahi</div>
        <div class="empty-sub">Admin se task assign karwao</div>
      </div>`;
    return;
  }

  // Sort: in_progress first, then pending, then rest
  const order = { in_progress:0, pending:1, in_review:2, blocked:3, completed:4 };
  const sorted = [...tasks].sort((a,b) => (order[a.status]??5) - (order[b.status]??5));

  container.innerHTML = `<div class="task-list">
    ${sorted.map(task => {
      const over = isOverdue(task.due_date, task.status);
      let cardClass = 'task-card';
      if (task.status === 'in_progress') cardClass += ' active';
      if (task.status === 'completed')   cardClass += ' done';
      if (task.status === 'blocked')     cardClass += ' blocked';

      return `
        <div class="${cardClass}" id="card-${task._id||task.id}">
          <div class="task-title">${task.title || 'Untitled'}</div>
          ${task.description ? `<div class="task-desc">${task.description}</div>` : ''}
          <div class="task-meta">
            ${statusBadge(task.status)}
            <span class="pri-${task.priority||'medium'}">${priLabel(task.priority||'medium')}</span>
            ${task.due_date ? `
              <span class="due-date ${over?'overdue':''}">
                📅 ${fmtDate(task.due_date)}${over?' ⚠':''}
              </span>` : ''}
          </div>
          <div id="actions-${task._id||task.id}">
            ${actionButtons(task)}
          </div>
        </div>
      `;
    }).join('')}
  </div>`;
}

// ── Update status ──────────────────────────────────────────────────
function updateStatus(taskId, newStatus) {
  if (updating) return;
  updating = taskId;

  // Disable buttons
  const actionsDiv = document.getElementById(`actions-${taskId}`);
  if (actionsDiv) {
    actionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  ipcRenderer.send('task-status-update', { taskId, status: newStatus });

  // Optimistic update
  tasks = tasks.map(t =>
    String(t._id||t.id) === String(taskId) ? {...t, status: newStatus} : t
  );
  renderTasks();

  const labels = {
    completed:   '✓ Task complete ho gaya!',
    in_progress: '▶ Task shuru ho gaya',
    in_review:   '👁 Review ke liye bheja',
    pending:     'Task pending kar diya',
  };
  showToast(labels[newStatus] || 'Status update ho gaya');
  updating = null;
}

// ── Load tasks ─────────────────────────────────────────────────────
function loadTasks() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  ipcRenderer.send('get-tasks');
}

// ── IPC listeners ──────────────────────────────────────────────────
ipcRenderer.on('tasks-data', (_, data) => {
  const btn = document.getElementById('refresh-btn');
  btn.classList.remove('spinning');

  if (Array.isArray(data)) {
    tasks = data;
    renderTasks();
  }
});

ipcRenderer.on('task-updated', (_, updated) => {
  if (updated) {
    const id = updated._id || updated.id || updated.taskId;
    if (id) {
      tasks = tasks.map(t =>
        String(t._id||t.id) === String(id) ? {...t, ...updated} : t
      );
      renderTasks();
    }
  }
});

ipcRenderer.on('tasks-error', (_, err) => {
  document.getElementById('refresh-btn').classList.remove('spinning');
  showToast('Tasks load nahi hue: ' + err, 'error');
});

// Employee name set karo
ipcRenderer.on('emp-info', (_, info) => {
  if (info?.name) {
    document.getElementById('emp-name').textContent = info.name;
  }
});

// Auto refresh har 30s
setInterval(loadTasks, 30000);

// Initial load
loadTasks();
</script>
</body>
</html>
